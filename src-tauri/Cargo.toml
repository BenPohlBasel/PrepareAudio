[package]
name = "prepare-audio"
version = "0.2.0"
description = "PrepareAudio: DJI-Mic-2-Aufnahmen zusammenfuegen, synchronisieren und mastern"
authors = ["B/IAS – Basel Institut für angewandte Stadtforschung"]
license = "AGPL-3.0-or-later"
edition = "2021"

[lib]
name = "prepare_audio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
symphonia = { version = "0.5", default-features = false, features = ["mp3", "aac", "isomp4", "flac", "aiff", "ogg", "vorbis", "alac", "wav", "pcm", "caf"] }
ebur128 = "0.1"
mp3lame-encoder = "0.2"
cpal = "0.16"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

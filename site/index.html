<style>
/* Recursive Variable Font — SIL OFL 1.1, Lizenztext in fonts/OFL.txt.
   Lokal eingebunden: die Seite lädt NICHTS von fremden Servern. */
@font-face{
  font-family:"Recursive";
  src:url("fonts/Recursive_VF.woff2") format("woff2");
  font-weight:300 1000;
  font-display:swap;
}
:root{
  --paper:#fff;--ink:#000;--ink-2:#000;--line:#e2e2e6;--rule:#9c9ca3;--wash:#f3f3f5;
  /* Der Ton kommt aus dem App-Zeichen (Verlauf #4f0070 → #ff5300), in
     Stufen: 600 trägt Knöpfe und Links, 700 den Zeigezustand, 300 die
     Links auf dunklem Grund. Dieselbe Aubergine wie in der App. */
  --aub-700:#43065f;--aub-600:#56107a;--aub-500:#4f0070;--aub-300:#d3a6ea;--aub-050:#f3eaf6;
  --aub:var(--aub-600);--aub-2:var(--aub-700);
  --w:72rem;
  --dunkel:#1b1b1f;--dunkel-2:#121215;--dunkel-line:#3b3b42;--dunkel-rule:#6d6d75;--dunkel-ink:#fff;--dunkel-ink-2:#fff;
}
*{box-sizing:border-box}
html{font-size:17px;-webkit-text-size-adjust:100%;scroll-behavior:smooth}
@media (max-width:640px){html{font-size:16px}}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"Recursive",system-ui,-apple-system,sans-serif;font-variation-settings:'CASL' 0,'MONO' 0;line-height:1.5}
a{color:inherit;text-decoration:underline;text-decoration-color:var(--aub);text-underline-offset:.18em;text-decoration-thickness:1.5px}
a:hover{text-decoration-thickness:2.5px}
:focus-visible{outline:2px solid var(--aub);outline-offset:3px}
img{max-width:100%;height:auto;display:block}
h1,h2,h3{margin:0;font-weight:600;letter-spacing:-.01em;line-height:1.15}
h1{font-size:clamp(2rem,4.6vw,3.4rem);font-weight:640}
h2{font-size:clamp(1.45rem,3vw,2rem)}
h3{font-size:1.15rem}
p{margin:0}
ul,ol{margin:0;padding-left:1.15rem}
li{margin:.35rem 0}
.small{font-size:.86rem;color:var(--ink-2)}
.wrap{max-width:var(--w);margin:0 auto;padding:0 1.25rem}

/* Raster wie bei LocalTranscript: Label 17 rem, Inhalt mindestens
   30 rem; ohne Platz fällt der Inhalt unter das Label. */
body{font-size:clamp(1rem,.85rem + .35vw,1.15rem)}
section{padding:4.5rem 0}
@media (max-width:640px){section{padding:3rem 0}}
main>section:nth-child(even){background:var(--wash)}
main>section.dpo{background:var(--dunkel)}
.row{display:flex;flex-wrap:wrap;gap:.9rem 3rem;align-items:flex-start}
.row>:first-child{flex:0 0 min(100%,17rem)}
.row>:last-child{flex:1 1 30rem;min-width:0}
.row.kopf{display:block;margin-bottom:2.5rem}
.row.kopf .t{margin-top:.9rem}
.row.schritt>:first-child{flex:1 1 26rem}
.row.schritt>:last-child{flex:1 1 30rem}
.row+.row{margin-top:1.6rem}
.row.gross+.row.gross{margin-top:2.25rem;padding-top:2.25rem;border-top:1px solid var(--rule)}
.row.kopf+.row.gross{border-top:0;padding-top:0;margin-top:0}
.row .t h3{margin-bottom:.35rem}
.row .t h3:has(.nr){display:flex;align-items:center}
.row .t p+p,.row .t ul,.row .t ol,.row .t ul+p{margin-top:.6rem}
.row .t li b,.row .t p b{font-weight:560}
.row>:first-child h3{font-size:1.05rem}
.row code{display:inline-block;margin-bottom:.4rem}
.row h3 .nr{display:inline-flex;align-items:center;justify-content:center;width:2.1rem;height:2.1rem;margin-right:.65rem;border-radius:50%;background:var(--aub);font-variation-settings:'MONO' 1;font-size:.95rem;font-weight:560;color:#fff;flex:none}
.keys{list-style:none;padding:0}
.keys li{display:flex;gap:.75rem;align-items:baseline}
.keys kbd{flex:0 0 5.2rem;font:inherit;font-variation-settings:'MONO' 1;font-size:.9rem;font-weight:560}
.lede{font-size:clamp(1.15rem,1rem + .5vw,1.4rem);line-height:1.4;color:var(--ink-2)}
.zitat{margin:0 0 3rem;padding:0}
.zitat p{font-size:clamp(2rem,4.6vw,3.4rem);line-height:1.15;letter-spacing:-.01em;font-weight:640;color:var(--ink)}
.zitat p::before{content:"«";margin-right:.05em}
.zitat p::after{content:"»";margin-left:.05em}
.zitat footer{margin-top:1.1rem;padding:0;background:none;font-size:1rem;color:var(--ink-2)}

header{position:sticky;top:0;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);z-index:5}
.bar{display:flex;align-items:center;justify-content:space-between;gap:1rem;height:3.5rem}
.brand{font-family:system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;font-weight:700;letter-spacing:.01em;color:#000;text-decoration:none;font-size:1.2rem}
.right{display:flex;align-items:center;gap:1.25rem}
.right a.nav{font-size:.92rem;color:#000;text-decoration:none}
.right a.nav:hover{text-decoration:underline;text-decoration-color:var(--aub)}
@media (max-width:860px){.right a.nav{display:none}}
.langs{display:flex;gap:.15rem}
.langs button{font:inherit;font-size:.9rem;background:none;border:1px solid transparent;border-radius:.35rem;padding:.25rem .5rem;color:#000;cursor:pointer;font-variation-settings:'MONO' 1}
.langs button[aria-pressed="true"]{border-color:var(--line);background:var(--wash)}

.hero{padding-top:3.5rem}
.hero h1{margin-bottom:2rem}
h1 .initial{width:.92em;height:.92em;display:inline-block;vertical-align:-.1em;margin-right:.22em}
.hero .row{align-items:flex-end}
.hero .row>:first-child{flex:1 1 30rem}
.hero .row>:last-child{flex:0 1 auto}
.cta{display:flex;flex-wrap:wrap;gap:.75rem 1rem}
.hero .small{margin-top:.9rem}
.window{margin-top:3rem;border:1px solid var(--line);border-radius:.7rem;overflow:hidden;background:var(--wash);box-shadow:0 1px 2px rgba(31,31,38,.05),0 8px 20px rgba(31,31,38,.08),0 32px 64px -16px rgba(31,31,38,.22)}
.window .chrome{height:1.7rem;background:#ececef;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:.4rem;padding-left:.75rem}
.window .chrome i{width:.7rem;height:.7rem;border-radius:50%;background:#d7d7dc;display:block}
.window img{width:100%;aspect-ratio:16/10}

.btn{display:inline-block;background:var(--aub);color:#fff;text-decoration:none;padding:.7rem 1.1rem;border-radius:.45rem;font-weight:560}
.btn:hover{background:var(--aub-2);color:#fff}
.btn.ghost{background:none;color:var(--ink);border:1px solid var(--line)}
.btn.ghost:hover{border-color:var(--ink)}

.shot{border:1px solid var(--line);border-radius:.5rem;overflow:hidden;background:var(--wash);box-shadow:0 1px 2px rgba(31,31,38,.05),0 6px 16px rgba(31,31,38,.08),0 24px 48px -12px rgba(31,31,38,.2)}
.shot img{width:100%}
.shot+.shot{margin-top:1rem}

code{font-variation-settings:'MONO' 1;font-size:.9rem;background:var(--paper);border:1px solid var(--line);border-radius:.3rem;padding:.15rem .45rem}

.dpo{background:var(--dunkel);color:var(--dunkel-ink)}
.dpo h2,.dpo h3{color:#fff}
.dpo a{color:#fff;text-decoration-color:var(--aub-300)}
.dpo .lede,.dpo .row .t p,.dpo .row .t li,.dpo .small{color:var(--dunkel-ink-2)}
.dpo .row.gross+.row.gross{border-top-color:var(--dunkel-rule)}

body>footer{padding:2.5rem 0 3rem;font-size:.88rem;color:var(--ink-2);background:var(--wash)}
footer .row>:first-child{flex:1 1 24rem}
footer .row>:last-child{flex:1 1 20rem}
footer address{font-style:normal}
footer .links{display:flex;flex-wrap:wrap;gap:.35rem .5rem}
</style>

  g1a:"Drag folders into the window or choose a folder. Merging accepts WAV only, from any audio recorder. The app searches every subfolder, however it is sorted, and recognises the chunks of a recording by their recording time: from the file's metadata (Broadcast WAV), from the file name or from the file date.",
  g1b:"A following chunk has the same format and starts where the previous full chunk ends; sample-exact when the metadata carry a time reference. If two chunks fit equally well, for instance with two transmitters, the audio at the seam decides: a linear predictor only forecasts the other side at the genuine join.",

  g2h:"Synchronise audio sources",
  g2a:"Drop the tracks folder into the second tab. Besides WAV, synchronising also takes MP3, M4A/AAC, FLAC, ALAC, AIFF, CAF and OGG and decodes them once so preview and timeline run smoothly; the results are WAV. The app looks for shared events with a fixed time offset: syllables, chairs scraping, dishes. Similar sound does not help, because with two lavalier mics the loudest voice is often opposite.",
  g2b:"For each track pair it measures offset, clock drift and spread and checks in 20-second windows whether the events agree. Shared stretches become stereo. They are only split when both transmitters record different conversations at the same time. If only one transmitter runs, that stays in the stereo file.",

  g3a:"The analysis proposal appears as a timeline. Stereo sits inside, where the tracks meet: the first transmitter blue on the left, the second red on the right. Mono is pushed outwards and paler. Cut-away parts are hatched, the shared events run underneath.",

/* Schlüssel, deren Text Auszeichnung enthält — nur diese als HTML. */
const HTML_KEYS = new Set(['d1','d2','d3','d4','d5']);

function setLang(l, inDieUrl){
  const t = T[l] || T.de;
  document.documentElement.lang = l;
  document.querySelectorAll('[data-t]').forEach(el=>{
    const k = el.dataset.t;
    const v = (k in t) ? t[k] : T.de[k];
    if(v === undefined) return;
    if(HTML_KEYS.has(k)) el.innerHTML = v; else el.textContent = v;
  });
  /* Bildschirmfotos gibt es je Sprache: img/<name>-<lang>.png */
  document.querySelectorAll('img[data-img], img[data-alt]').forEach(im=>{
    if(im.dataset.img) im.src = 'img/' + im.dataset.img + '-' + l + '.png';
    const a = im.dataset.alt;
    if(a) im.alt = (a in t) ? t[a] : (T.de[a] || im.alt);
  });
  document.querySelectorAll('.langs button').forEach(b=>
    b.setAttribute('aria-pressed', String(b.dataset.lang===l)));
  /* Sprache in ?lang=, der Hash gehört den Abschnitten. */
  if(inDieUrl){
    try{
      const u = new URL(location.href);
      u.searchParams.set('lang', l);
      history.replaceState(null, '', u);
    }catch(e){}
  }
}

document.querySelectorAll('.langs button').forEach(b=>
  b.addEventListener('click', ()=>setLang(b.dataset.lang, true)));

const ausUrl = new URLSearchParams(location.search).get('lang');
const ausBrowser = (navigator.language || 'de').slice(0,2);
setLang(T[ausUrl] ? ausUrl : T[ausBrowser] ? ausBrowser : 'de', false);
</script>
